<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASL Admin</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --line:#e3e2dc; --text:#1f1f1c; --muted:#6b6a64; --accent:#4b45a1; --ok:#1d7a4f; --warn:#a15c07; --bad:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#191917; --card:#22221f; --line:#3a3934; --text:#ecebe6; --muted:#a3a29b; --accent:#a9a3f0; --ok:#5cc28f; --warn:#e3a14a; --bad:#f07065; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; gap:16px; align-items:center; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--card); }
  header h1 { font-size:16px; margin:0; }
  header .stats { color:var(--muted); font-size:12px; margin-left:auto; }
  main { display:grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 50px); }
  nav { border-right:1px solid var(--line); padding:12px; }
  nav button { display:block; width:100%; text-align:left; padding:8px 10px; margin-bottom:4px; border:1px solid transparent; border-radius:8px; background:none; color:inherit; cursor:pointer; }
  nav button.active { background:var(--card); border-color:var(--line); }
  nav small { color:var(--muted); display:block; }
  section { padding:16px 20px; overflow:auto; }
  h2 { font-size:15px; margin:4px 0 10px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); margin-bottom:18px; }
  th, td { padding:6px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; font-size:13px; }
  th { color:var(--muted); font-weight:500; }
  tr.detail td { background:var(--bg); }
  .pill { display:inline-block; padding:1px 7px; border-radius:999px; font-size:11px; border:1px solid var(--line); margin-right:4px; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); } .muted { color:var(--muted); }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size:12px; }
  button.act { padding:3px 8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:inherit; cursor:pointer; font-size:12px; margin:1px; }
  button.act:hover { border-color:var(--accent); }
  form.edit { display:flex; flex-wrap:wrap; gap:8px; align-items:end; padding:8px 0 14px; }
  form.edit label { display:flex; flex-direction:column; font-size:11px; color:var(--muted); gap:2px; }
  form.edit select, form.edit input { padding:4px 6px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:inherit; width:110px; }
  svg.spark { width:160px; height:28px; }
  svg.spark polyline { fill:none; stroke:var(--accent); stroke-width:1.5; }
  #msg { position:fixed; bottom:16px; right:16px; padding:8px 12px; border-radius:8px; background:var(--card); border:1px solid var(--line); display:none; }
</style>
</head>
<body>
<header><h1>ASL Admin</h1><div><button class="act" id="tab-apps">Applications</button><button class="act" id="tab-audit">Audit</button></div><div class="stats" id="stats"></div></header>
<main>
  <nav id="apps"></nav>
  <section id="content"><p class="muted">Select an application.</p></section>
</main>
<div id="msg"></div>
<script>
(() => {
  // Sample layout sent by the server, one array per replica and method.
  const STATE = 0, MAX = 1, CONSUMERS = 2, IN_FLIGHT = 3, SUCCESS = 4, ERROR = 5, REJECTED = 6, Q_PENDING = 7, Q_FAILED = 8, Q_RUNNING = 9;
  const ENABLED = 1, ASYNC = 2;
  const api = "/asl-admin/api";
  let selected = null, expanded = new Set(), editing = false, view = "apps", timer = null;
  const historyCache = new Map();

  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") node.className = v;
      else if (k.startsWith("on")) node.addEventListener(k.substring(2), v);
      else if (v !== undefined && v !== null && v !== false) node.setAttribute(k, v);
    }
    for (const child of children.flat()) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }
  const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(Math.round(n * 10) / 10);
  const ago = ms => ms < 1000 ? "now" : ms < 60000 ? Math.round(ms / 1000) + "s" : Math.round(ms / 60000) + "m";
  const short = id => id.replace(/[a-zA-Z0-9_$]+\./g, "");
  const describe = s => !s ? "—" : [s.enabled === false ? "disabled" : s.enabled === true ? "enabled" : null,
      s.async === true ? "ASYNC" : s.async === false ? "SYNC" : null,
      s.maxConcurrency != null ? "max " + s.maxConcurrency : null,
      s.consumerThreads != null ? "consumers " + s.consumerThreads : null].filter(Boolean).join(", ");

  function toast(text, bad) {
    const m = document.getElementById("msg");
    m.textContent = text; m.className = bad ? "bad" : "ok"; m.style.display = "block";
    clearTimeout(toast.t); toast.t = setTimeout(() => m.style.display = "none", 3500);
  }
  async function call(method, path, form) {
    const res = await fetch(api + path, { method, body: form ? new URLSearchParams(form) : undefined, credentials: "same-origin" });
    if (!res.ok) { let e = res.statusText; try { e = (await res.json()).error || e; } catch (_) {} throw new Error(e); }
    return res.status === 204 ? null : res.json();
  }
  const appPath = suffix => "/apps/" + encodeURIComponent(selected) + suffix;

  // ---- derived values, all computed here; the server only relays ----
  function totals(app, i) {
    const t = { instances: 0, enabled: 0, async: 0, inFlight: 0, success: 0, error: 0, rejected: 0, pending: 0, failed: 0, divergent: false };
    let first = null;
    for (const inst of app.instances) {
      const s = inst.samples[i];
      if (!s) continue;
      t.instances++; t.enabled += s[STATE] & ENABLED ? 1 : 0; t.async += s[STATE] & ASYNC ? 1 : 0;
      t.inFlight += s[IN_FLIGHT]; t.success += s[SUCCESS]; t.error += s[ERROR]; t.rejected += s[REJECTED];
      t.pending += s[Q_PENDING]; t.failed += s[Q_FAILED];
      const signature = s[STATE] + "/" + s[MAX];
      if (first === null) first = signature; else if (first !== signature) t.divergent = true;
    }
    return t;
  }
  // History rows from the server are raw values per replica: [time, state, max, consumers, inFlight, success, error, rejected, pending, failed, running].
  function aggregate(history) {
    const step = history.resolutionMillis / 1000, byTime = new Map();
    for (const series of history.instances) {
      let previous = null;
      for (const p of series.points) {
        const row = byTime.get(p[0]) || { t: p[0], inFlight: 0, perSecond: 0, errors: 0, pending: 0, failed: 0 };
        row.inFlight += p[4]; row.pending += p[8]; row.failed += p[9];
        if (previous && p[0] - previous[0] === history.resolutionMillis) {
          row.perSecond += Math.max(0, p[5] - previous[5]) / step;
          row.errors += Math.max(0, p[6] - previous[6]) / step;
        }
        byTime.set(p[0], row); previous = p;
      }
    }
    return [...byTime.values()].sort((a, b) => a.t - b.t);
  }
  function trend(m, target) {
    const key = selected + "|" + m.serviceId + "|" + m.methodId, cached = historyCache.get(key);
    const draw = rows => {
      if (rows.length < 2) { target.replaceChildren(el("span", { class: "muted" }, "Not enough history yet.")); return; }
      target.replaceChildren(el("div", { class: "muted" }, `Stored history: ${new Date(rows[0].t).toLocaleTimeString()} – ${new Date(rows[rows.length - 1].t).toLocaleTimeString()}`),
        ...[["in flight", r => r.inFlight], ["calls/s", r => r.perSecond], ["errors/s", r => r.errors], ["queue pending", r => r.pending], ["queue failed", r => r.failed]]
          .map(([name, pick]) => spark(name, rows.map(pick))));
    };
    if (cached && Date.now() - cached.at < 15000) { draw(cached.rows); return; }
    const q = new URLSearchParams({ serviceId: m.serviceId, methodId: m.methodId });
    call("GET", appPath("/history?" + q)).then(h => { const rows = aggregate(h); historyCache.set(key, { at: Date.now(), rows }); draw(rows); })
      .catch(e => target.replaceChildren(el("span", { class: "bad" }, e.message)));
  }

  async function loadServer() {
    try {
      const s = await call("GET", "/server");
      document.getElementById("stats").textContent =
        `${s.applications} apps · ${s.instances} instances · storage ${s.storageMode} ${fmt(s.storeBytes)}B · history ${s.historySeries} series × ${s.historyPointsPerSeries} points`;
    } catch (_) {}
  }

  async function loadApps() {
    const nav = document.getElementById("apps");
    let apps = [];
    try { apps = await call("GET", "/apps"); } catch (e) { toast(e.message, true); }
    nav.replaceChildren(...apps.map(a => el("button", { class: a.name === selected ? "active" : "", onclick: () => { selected = a.name; expanded.clear(); editing = false; view = "apps"; loadApps(); loadApp(); } },
      a.name,
      el("small", {}, `${a.instances} instances · ${a.methods} methods`,
        a.outOfSync ? el("span", { class: "warn" }, ` · ${a.outOfSync} applying`) : null,
        a.configErrors ? el("span", { class: "bad" }, ` · ${a.configErrors} errors`) : null,
        a.queueFailed ? el("span", { class: "bad" }, ` · ${a.queueFailed} failed`) : null))));
    if (!apps.length) nav.replaceChildren(el("p", { class: "muted" }, "No application connected yet."));
  }

  async function loadApp() {
    clearTimeout(timer);
    if (view !== "apps" || !selected) return;
    try { const app = await call("GET", appPath("")); if (!editing) render(app); }
    catch (e) { document.getElementById("content").replaceChildren(el("p", { class: "bad" }, e.message)); }
    timer = setTimeout(loadApp, 2000);
  }

  function render(app) {
    const instances = el("table", {}, el("tr", {}, ["Instance", "Last seen", "Uptime", "Settings", "Open commands", "Version"].map(h => el("th", {}, h))),
      app.instances.map(i => el("tr", {},
        el("td", { class: "mono" }, i.name), el("td", {}, ago(i.lastSeenMillisAgo)), el("td", {}, ago(i.uptimeMillis)),
        el("td", {}, i.configError ? el("span", { class: "bad" }, i.configError) : i.inSync ? el("span", { class: "ok" }, "in sync") : el("span", { class: "warn" }, "applying…")),
        el("td", {}, i.pendingCommands), el("td", { class: "muted" }, i.libraryVersion || ""))));
    const rows = [];
    app.methods.forEach((m, idx) => {
      const key = m.serviceId + "#" + m.methodId, t = totals(app, idx);
      rows.push(el("tr", {},
        el("td", {}, el("button", { class: "act", onclick: () => { expanded.has(key) ? expanded.delete(key) : expanded.add(key); render(app); } }, expanded.has(key) ? "−" : "+")),
        el("td", {}, el("div", {}, short(m.serviceId) + "." + short(m.methodId)), m.override ? el("span", { class: "pill" }, "all: " + describe(m.override)) : null, t.divergent ? el("span", { class: "pill warn" }, "replicas differ") : null),
        el("td", {}, `${t.enabled}/${t.instances} on`, el("br"), m.asyncCapable ? `${t.async} async` : el("span", { class: "muted" }, "sync only")),
        el("td", {}, fmt(t.inFlight)), el("td", {}, fmt(t.success)), el("td", { class: t.error ? "bad" : "" }, fmt(t.error)), el("td", { class: t.rejected ? "warn" : "" }, fmt(t.rejected)),
        el("td", {}, m.hasQueue ? `${fmt(t.pending)} / ` : "—", m.hasQueue ? el("span", { class: t.failed ? "bad" : "" }, fmt(t.failed)) : null),
        el("td", {}, el("button", { class: "act", onclick: () => openEditor(app, m, idx, null) }, "Tune all"),
          m.hasQueue ? el("button", { class: "act", onclick: () => command(m, "*", "CLEAR_QUEUE", null, "Clear the queue on every instance?") }, "Clear queue") : null)));
      if (expanded.has(key)) rows.push(detail(app, m, idx));
    });
    const methods = el("table", {}, el("tr", {}, ["", "Method", "State", "In flight", "Success", "Errors", "Rejected", "Queue pending / failed", ""].map(h => el("th", {}, h))), rows);
    const results = el("table", {}, el("tr", {}, ["Command", "Instance", "Method", "Status", "Result", "By"].map(h => el("th", {}, h))),
      app.commands.slice(0, 20).map(c => el("tr", {},
        el("td", {}, c.type), el("td", { class: "mono" }, c.instance), el("td", {}, short(c.methodId)),
        el("td", { class: c.status === "OK" ? "ok" : c.status === "PENDING" ? "muted" : "bad" }, c.status),
        el("td", {}, c.message || (c.type === "BROWSE_QUEUE" && c.status === "OK" ? entries(c) : String(c.value))), el("td", { class: "muted" }, c.actor || ""))));
    document.getElementById("content").replaceChildren(
      el("h2", {}, app.name, el("span", { class: "muted" }, `  · settings v${app.configVersion || 0} · heartbeat ${app.intervalMillis / 1000}s`)),
      instances, methods, el("h2", {}, "Recent commands"), app.commands.length ? results : el("p", { class: "muted" }, "None"));
  }

  function detail(app, m, idx) {
    const per = el("table", {}, el("tr", {}, ["Instance", "Enabled", "Mode", "Max", "Consumers", "In flight", "Errors", "Queue pending / failed / running", "Instance override", ""].map(h => el("th", {}, h))),
      app.instances.filter(i => i.samples[idx]).map(i => {
        const s = i.samples[idx];
        return el("tr", {},
          el("td", { class: "mono" }, i.name), el("td", { class: s[STATE] & ENABLED ? "ok" : "bad" }, s[STATE] & ENABLED ? "yes" : "no"), el("td", {}, s[STATE] & ASYNC ? "ASYNC" : "SYNC"),
          el("td", {}, s[MAX] >= 2147483647 ? "∞" : s[MAX]), el("td", {}, s[CONSUMERS]), el("td", {}, s[IN_FLIGHT]), el("td", {}, s[ERROR]),
          el("td", {}, m.hasQueue ? `${s[Q_PENDING]} / ${s[Q_FAILED]} / ${s[Q_RUNNING]}` : "—"), el("td", {}, describe(i.overrides[idx])),
          el("td", {}, el("button", { class: "act", onclick: () => openEditor(app, m, idx, i.name) }, "Tune"),
            m.hasQueue ? el("button", { class: "act", onclick: () => command(m, i.name, "BROWSE_QUEUE") }, "Browse") : null,
            el("button", { class: "act", onclick: () => command(m, i.name, "RESET_OBSERVATIONS") }, "Reset stats")));
      }));
    const charts = el("div", { class: "muted" }, "Loading history…");
    trend(m, charts);
    return el("tr", { class: "detail" }, el("td", {}), el("td", { colspan: 8 }, per, charts));
  }

  function spark(name, values) {
    const max = Math.max(1, ...values);
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "spark"); svg.setAttribute("viewBox", "0 0 160 28");
    if (values.length > 1) {
      const line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
      line.setAttribute("points", values.map((v, i) => `${(i / (values.length - 1)) * 160},${28 - (v / max) * 26}`).join(" "));
      svg.append(line);
    }
    return el("span", { style: "display:inline-block;margin-right:14px" }, el("small", { class: "muted" }, `${name} (max ${fmt(max)})`), el("br"), svg);
  }

  function entries(c) {
    if (!c.entries.length) return "empty";
    return el("div", {}, c.entries.map(e => el("div", { class: "mono" }, `#${e.entryId} ${e.state} attempts=${e.attempts}${e.interruptions ? " interrupted×" + e.interruptions : ""} `,
      e.lastError ? el("span", { class: "bad" }, e.lastError + " ") : null,
      el("button", { class: "act", onclick: () => command({ serviceId: c.serviceId, methodId: c.methodId }, c.instance, "REPLAY_ENTRY", e.entryId) }, "Replay"),
      el("button", { class: "act", onclick: () => command({ serviceId: c.serviceId, methodId: c.methodId }, c.instance, "DELETE_ENTRY", e.entryId, "Delete this entry?") }, "Delete"))));
  }

  function openEditor(app, m, idx, instance) {
    const current = instance ? (app.instances.find(i => i.name === instance) || { overrides: [] }).overrides[idx] : m.override;
    const s = current || {};
    const tri = (name, value, on, off) => el("select", { name }, el("option", { value: "" }, "keep"),
      el("option", { value: "true", selected: value === true }, on), el("option", { value: "false", selected: value === false }, off));
    const close = () => { editing = false; loadApp(); };
    const form = el("form", { class: "edit", onsubmit: async ev => {
      ev.preventDefault();
      const f = new FormData(form), body = { serviceId: m.serviceId, methodId: m.methodId };
      if (instance) body.instance = instance;
      for (const [k, v] of f.entries()) if (v !== "") body[k] = v;
      try { await call("POST", appPath("/overrides"), body); toast("Saved; replicas apply it with the next heartbeat"); close(); }
      catch (e) { toast(e.message, true); }
    } },
      el("strong", {}, (instance ? instance + " · " : "All instances · ") + short(m.methodId)),
      el("label", {}, "Enabled", tri("enabled", s.enabled, "on", "off")),
      m.asyncCapable ? el("label", {}, "Mode", tri("async", s.async, "ASYNC", "SYNC")) : null,
      el("label", {}, "Max concurrency", el("input", { name: "maxConcurrency", type: "number", min: 1, value: s.maxConcurrency ?? "" })),
      m.asyncCapable ? el("label", {}, "Consumers", el("input", { name: "consumerThreads", type: "number", min: 0, value: s.consumerThreads ?? "" })) : null,
      el("button", { class: "act", type: "submit" }, "Apply"),
      el("button", { class: "act", type: "button", onclick: async () => {
        const q = new URLSearchParams({ serviceId: m.serviceId, methodId: m.methodId }); if (instance) q.set("instance", instance);
        try { await call("DELETE", appPath("/overrides?" + q)); toast("Override removed; replicas return to their own settings"); close(); }
        catch (e) { toast(e.message, true); } } }, "Clear override"),
      el("button", { class: "act", type: "button", onclick: close }, "Cancel"));
    editing = true;
    document.getElementById("content").prepend(form);
  }

  async function command(m, instance, type, entryId, confirmText) {
    if (confirmText && !confirm(confirmText)) return;
    const body = { serviceId: m.serviceId, methodId: m.methodId, instance, type, limit: 20 };
    if (entryId) body.entryId = entryId;
    try { await call("POST", appPath("/commands"), body); toast(type + " sent"); loadApp(); }
    catch (e) { toast(e.message, true); }
  }

  async function loadAudit() {
    clearTimeout(timer);
    try {
      const rows = await call("GET", "/audit?limit=200");
      document.getElementById("content").replaceChildren(el("h2", {}, "Audit"), el("table", {}, el("tr", {}, ["Time", "User", "Application", "Action", "Detail"].map(h => el("th", {}, h))),
        rows.map(r => el("tr", {}, el("td", {}, new Date(r.timeMillis).toLocaleString()), el("td", {}, r.actor), el("td", {}, r.application), el("td", {}, r.action), el("td", { class: "mono" }, r.detail)))));
    } catch (e) { toast(e.message, true); }
  }

  document.getElementById("tab-apps").onclick = () => { view = "apps"; editing = false; loadApp(); };
  document.getElementById("tab-audit").onclick = () => { view = "audit"; editing = false; loadAudit(); };
  loadServer(); loadApps();
  setInterval(() => { loadServer(); loadApps(); }, 10000);
})();
</script>
</body>
</html>
