name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / ${{ matrix.distribution }} / Java 21
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        distribution: [temurin, semeru]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.distribution }}
          java-version: "21"
          cache: maven

      - name: Run verification suite
        run: mvn -B -ntp verify

      - name: Upload failing test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ matrix.os }}-${{ matrix.distribution }}
          path: "**/target/surefire-reports/**"
          if-no-files-found: ignore

  supply-chain-and-api:
    name: SBOM and API Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout full release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build aggregate CycloneDX SBOM
        run: mvn -B -ntp -Psbom -DskipTests package

      - name: Check public API compatibility
        shell: pwsh
        run: ./scripts/run-api-compatibility-gate.ps1 -SkipCurrentBuild

      - name: Upload supply-chain and API evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-and-api-evidence
          path: |
            target/bom.json
            target/bom.xml
            target/api-compatibility/summary.json
            target/api-compatibility/reports/**
          if-no-files-found: warn
