name: Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
            VERSION="${VERSION/-SNAPSHOT/}"
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          mvn -B -ntp versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build, generate SBOM, and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -ntp -Ppublic-release,sbom deploy

      - name: Create Source Archive
        shell: bash
        run: |
          git archive --format=zip --output="async-service-library-${RELEASE_VERSION}-sources.zip" HEAD

      - name: Build Release Notes
        shell: bash
        run: |
          cat > .github/release-notes.generated.md <<EOF
          # Async Service Library v${RELEASE_VERSION}
          
          This release publishes the production-hardening refactor of Async Service Library.
          
          Included in this version:
          
          - allocation-conscious compile-time governed service wrappers
          - independent core, MapDB, and admin Spring Boot starters plus the compatibility starter
          - opt-in, fail-closed admin control plane with access-policy and audit extension points
          - bounded MapDB async execution with FIFO indexes, group commit, leases, retries, and idempotency keys
          - versioned payload codecs with allowlists, migration hooks, redaction, and size limits
          - Micrometer metrics, JVM/OS CI coverage, API compatibility checks, and CycloneDX SBOMs
          - complete English and Turkish configuration and usage documentation
          
          Current boundary:
          
          - runtime \`SYNC -> ASYNC\` switching is supported for \`void\` methods only
          - MapDB is a single-process local queue; sharing one store between replicas is unsupported
          - delivery is at-least-once, so external business side effects must remain idempotent
          - production admin access requires a host-provided \`AslAdminAccessPolicy\`
          
          Start here:
          
          - README: https://github.com/esasmer-dou/async-service-library
          - usage guide: https://github.com/esasmer-dou/async-service-library/blob/main/USAGE_GUIDE.md
          - configuration reference: https://github.com/esasmer-dou/async-service-library/blob/main/CONFIGURATION_REFERENCE.md
          - sample app: https://github.com/esasmer-dou/async-service-library/tree/main/asl-consumer-sample
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: .github/release-notes.generated.md
          files: |
            async-service-library-${{ env.RELEASE_VERSION }}-sources.zip
            asl-annotations/target/*.jar
            asl-core/target/*.jar
            asl-mapdb/target/*.jar
            asl-processor/target/*.jar
            asl-spring-boot-core-starter/target/*.jar
            asl-spring-boot-mapdb-starter/target/*.jar
            asl-spring-boot-admin-starter/target/*.jar
            asl-spring-boot-starter/target/*.jar
            target/bom.json
            target/bom.xml
