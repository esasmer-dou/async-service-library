version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
      test-and-build:
        patterns:
          - "org.junit*"
          - "org.jacoco*"
          - "org.apache.maven.plugins*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
