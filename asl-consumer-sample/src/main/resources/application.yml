server:
  port: 8080
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 15s

asl:
  runtime:
    default-unavailable-message: Method is disabled
    max-concurrency-exceeded-message-template: "Method reached max concurrency: %d"
    services:
      "[mail.service]":
        methods:
          "[send(java.lang.String)]":
            max-concurrency: 6
          "[publishAudit(java.lang.String)]":
            execution-mode: ASYNC
            consumer-threads: 2
  admin:
    # Central admin server connection. Off by default; turn it on with
    # ASL_ADMIN_CLIENT_ENABLED=true, ASL_ADMIN_CLIENT_SERVER_URL and ASL_ADMIN_CLIENT_SECRET.
    client:
      enabled: false
      application: asl-consumer-sample
      queue-browse: true
  async:
    mapdb:
      enabled: true
      codec: jackson-json
      path: ./data/asl-consumer-sample-queue.db
      worker-shutdown-await-millis: 10000
      registration-idle-sleep-millis: 100
      empty-queue-sleep-millis: 50
      requeue-delay-millis: 75
      recovered-in-progress-message: Recovered stale in-progress invocation after restart
      transactions-enabled: true
      memory-mapped-enabled: false
      corruption-policy: ARCHIVE_AND_RESET
      payload:
        # The sample shows argument summaries in the admin portal's queue dialog. The default, TYPE_ONLY,
        # stores only the payload type; CODEC stores a short text of the arguments, which can hold business data.
        summary-policy: CODEC
      admission:
        max-concurrent-enqueues: 64
